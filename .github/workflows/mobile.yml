name: Mobile build

on:
  pull_request:
    branches: [test, staging, production]
    paths:
      - 'apps/mobile/**'
      - '.github/workflows/mobile.yml'
  push:
    branches: [test, staging, production]
    paths:
      - 'apps/mobile/**'
      - '.github/workflows/mobile.yml'

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - run: test -f "$ANDROID_HOME/platforms/android-37.0/android.jar"
      - run: ./gradlew :androidApp:assembleDebug --console=plain
        working-directory: apps/mobile

  ios-framework:
    runs-on: macos-26
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - run: xcodebuild -version
        env:
          DEVELOPER_DIR: /Applications/Xcode_26.5.app/Contents/Developer
      - run: ./gradlew :shared:linkDebugFrameworkIosSimulatorArm64 --console=plain
        working-directory: apps/mobile
        env:
          DEVELOPER_DIR: /Applications/Xcode_26.5.app/Contents/Developer
